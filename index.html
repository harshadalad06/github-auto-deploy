
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My GitHub Actions Website</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      color: #172033;
      background: linear-gradient(135deg, #dbeafe, #ede9fe);
    }

    .card {
      width: min(90%, 520px);
      padding: 40px 28px;
      text-align: center;
      background: white;
      border-radius: 20px;
      box-shadow: 0 15px 45px #00000018;
    }

    h1 { color: #4338ca; }
    p { line-height: 1.7; }

    button {
      padding: 12px 22px;
      border: 0;
      border-radius: 10px;
      background: #4f46e5;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover { background: #3730a3; }
  </style>
</head>
<body>
  <main class="card">
    <h1>My First Deployed Website 🚀</h1>

    <p id="message">
      Deployed automatically using GitHub Actions!
    </p>

    <p>Button clicks: <strong id="count">0</strong></p>

    <button onclick="increaseCount()">Click Me</button>
  </main>

  <script>
    let count = 0;

    function increaseCount() {
      count++;
      document.getElementById("count").textContent = count;
    }
  </script>
</body>
</html>
